; Dialplan — TEMPLATE (Phase 3), not validated.
;
; Routes WhatsApp calls into the Dograh Stasis (ARI) app. Dograh then owns the
; conversation and, once media is up, reports the session id to Pons.

[globals]
DOGRAH_APP = dograh ; must match ari.conf app + DOGRAH_STASIS_APP in .env

; ── Inbound: user-initiated WhatsApp call → Dograh agent ──
[from-whatsapp]
exten => _.,1,NoOp(Inbound WhatsApp call from ${CALLERID(num)})
 same => n,Stasis(${DOGRAH_APP})
 same => n,Hangup()

; ── Outbound: business-initiated call bridged from Pons/Meta ──
; When Pons initiates a call (whatsappCalls.initiateCall), Meta anchors media to
; this Asterisk endpoint. The exact origination trigger depends on the SIP-mode
; handshake (Phase 0 unknown) — this context is where that leg lands.
[to-whatsapp]
exten => _.,1,NoOp(Outbound WhatsApp call leg)
 same => n,Stasis(${DOGRAH_APP})
 same => n,Hangup()
