; ARI config — TEMPLATE (Phase 3), not validated.
;
; The REST/WebSocket interface Dograh connects to in order to control calls
; handed off via Stasis(dograh) in extensions.conf. Substitute real credentials
; (ARI_USERNAME / ARI_PASSWORD in .env) — Asterisk does not expand env vars here.

[general]
enabled = yes
pretty = yes
allowed_origins = *

[dograh]
type = user
read_only = no
password = ${ARI_PASSWORD}
