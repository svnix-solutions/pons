; PJSIP config — TEMPLATE (Phase 3), NOT validated against a live WhatsApp SIP
; connection. Fill in the Meta SIP trunk values from Meta's SIP Configuration
; guide. Placeholders are written as ${ENV_VAR} for reference — Asterisk does
; NOT expand env vars in pjsip.conf; substitute real values (or template this
; file at deploy time).

; ── Transport ──
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0

; SRTP-capable TLS transport is typically required by Meta — confirm in the SIP
; guide and switch the trunk to use it.
[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0
; cert_file = /etc/asterisk/keys/asterisk.pem
; ca_list_file = /etc/asterisk/keys/ca.pem

; ── WhatsApp / Meta SIP trunk ──
[meta-whatsapp]
type = registration
transport = transport-tls
outbound_auth = meta-auth
server_uri = sip:${META_SIP_SERVER}
client_uri = sip:${META_SIP_USERNAME}@${META_SIP_REALM}
retry_interval = 60

[meta-auth]
type = auth
auth_type = userpass
username = ${META_SIP_USERNAME}
password = ${META_SIP_PASSWORD}

[meta-endpoint]
type = endpoint
transport = transport-tls
context = from-whatsapp
disallow = all
; Meta supports OPUS / PCMU / PCMA — confirm ordering/requirements in the guide.
allow = opus
allow = ulaw
allow = alaw
media_encryption = sdes ; SIP + SDES SRTP per Meta's SIP mode
outbound_auth = meta-auth
aors = meta-aor

[meta-aor]
type = aor
contact = sip:${META_SIP_SERVER}

[meta-identify]
type = identify
endpoint = meta-endpoint
; match = <Meta SIP source IP/host — from the SIP guide>
